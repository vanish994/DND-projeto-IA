name: CI
on:
  pull_request:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: pip install -r requirements-dev.txt
      - name: black (format check)
        run: black --check .
      - name: isort (import order check)
        run: isort --check-only .
      - name: ruff (lint)
        run: ruff check .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt httpx
      - name: Collect tests (diagnóstico de import)
        run: |
          set +e
          pytest --collect-only -q > collect.log 2>&1
          code=$?
          cat collect.log
          if [ $code -ne 0 ]; then
            echo "::error title=pytest collect falhou (início do log)::$(head -c 700 collect.log | tr '\n' '|' | tr -d '\r')"
            echo "::error title=pytest collect falhou (exceções)::$(grep -oE '[A-Za-z_.]*(Error|Exception):[^|]*' collect.log | sort -u | head -5 | tr '\n' ';')"
          fi
          exit $code
      - name: Python test suite with coverage floor
        run: pytest -q --cov --cov-fail-under=80 2>&1 | tee pytest-ci.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-log
          path: |
            pytest-ci.log
            collect.log
          if-no-files-found: ignore
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: node --test tests/*.cjs
