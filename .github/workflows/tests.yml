name: CI
on:
  pull_request:
  push:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: pip install -r requirements-dev.txt
      - name: black (format check)
        run: black --check .
      - name: isort (import order check)
        run: isort --check-only .
      - name: ruff (lint)
        run: ruff check .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt httpx
      - name: Python test suite with coverage floor
        run: pytest -q --cov --cov-fail-under=80
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript tests
        run: node --test tests/*.cjs
