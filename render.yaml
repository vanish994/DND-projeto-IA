services:
  - type: web
    name: dnd-projeto-ia-mj
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/status
    autoDeploy: true
    envVars:
      - key: TOKENHARBOR_API_KEY
        sync: false
      - key: TOKENHARBOR_BASE_URL
        value: https://tokenharbor.ai/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4.1-flash:free
      - key: DATABASE_URL
        sync: false
